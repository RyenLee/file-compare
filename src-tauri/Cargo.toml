[package]
name = "file-compare"
version = "1.0.0"
description = "A Tauri App for comparing filenames between two folders"
authors = ["you"]
edition = "2021"

[lib]
name = "file_compare_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
tauri = { version = "2.11.0", features = [] }
tauri-plugin-dialog = { version = "2.0.0-rc.8" }
tauri-plugin-fs = { version = "2.0.0-rc.6" }
serde = { version = "1.0.172-alpha.0" }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["full"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
